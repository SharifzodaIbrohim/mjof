<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг — Маҷмӯаи Олимпиадаҳои Фаннӣ</title>
  <link rel="stylesheet" href="css/platform.css" />
  <style>
    .lb-wrap { max-width: 920px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .lb-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .lb-head h1 { margin: 0; font-size: 1.55rem; }
    .lb-head p { margin: 0.25rem 0 0; color: var(--pf-muted); }
    .podium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; align-items: end; }
    .pod {
      background: var(--pf-panel); border: 1px solid var(--pf-line); border-radius: 12px;
      padding: 1rem 0.75rem; text-align: center; position: relative; box-shadow: var(--pf-shadow);
    }
    .pod.p1 { order: 2; transform: translateY(-8px); border-color: #93c5fd; }
    .pod.p2 { order: 1; }
    .pod.p3 { order: 3; }
    .pod .medal { font-size: 1.5rem; margin-bottom: 0.3rem; }
    .pod .name { font-weight: 700; font-size: 0.95rem; margin: 0.2rem 0; }
    .pod .meta { color: var(--pf-muted); font-size: 0.8rem; }
    .pod .score { margin-top: 0.4rem; font-weight: 800; color: var(--pf-accent); font-size: 1.1rem; }
    .pod .place {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      background: var(--pf-accent); color: #fff; font-weight: 800; font-size: 0.75rem;
      padding: 0.15rem 0.55rem; border-radius: 999px;
    }
    .lb-table { width: 100%; border-collapse: collapse; background: var(--pf-panel); border-radius: 12px; overflow: hidden; box-shadow: var(--pf-shadow); }
    .lb-table th, .lb-table td { text-align: left; padding: 0.75rem 0.65rem; border-bottom: 1px solid var(--pf-line); }
    .lb-table th { color: var(--pf-muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: var(--pf-bg-elevated); }
    .lb-rank { font-weight: 800; color: var(--pf-accent); width: 3rem; }
    .lb-empty { text-align: center; color: var(--pf-muted); padding: 2.5rem 1rem; }
    @media (max-width: 640px) {
      .podium { grid-template-columns: 1fr; }
      .pod.p1, .pod.p2, .pod.p3 { order: 0; transform: none; }
      .lb-table { font-size: 0.85rem; }
      .lb-table th, .lb-table td { padding: 0.65rem 0.5rem; }
    }
  </style>
</head>
<body class="pf-page-leaderboard">
  <header class="pf-topbar">
    <a class="pf-brand" href="/">
      <span class="pf-brand-mark">МФ</span>
      <span class="pf-brand-text"><strong>M.J.O.F</strong><span>Маҷмӯаи Олимпиадаҳои Фаннӣ</span></span>
    </a>
    <nav class="pf-nav">
      <a href="/">Асосӣ</a>
      <a href="/student">Олимпиадаҳо</a>
      <a href="/leaderboard" class="active">Рейтинг</a>
      <a href="/courses">Хабарҳо</a>
    </nav>
    <div class="pf-actions">
      <select id="pfLang" class="pf-lang" title="Забон" aria-label="Language">
        <option value="tg">TJ</option>
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button type="button" class="pf-icon-btn" id="pfTheme" title="Тема">🌙</button>
    </div>
  </header>
  <div class="lb-wrap">
    <div class="lb-head">
      <div>
        <h1 id="lbTitle">Рейтинг</h1>
        <p id="lbSub">Рейтинги иштирокчиёни олимпиадаҳо</p>
      </div>
      <a href="/" style="color:var(--pf-accent);font-weight:600;text-decoration:none">← Асосӣ</a>
    </div>
    <div id="podium" class="podium"></div>
    <div id="lbBody"></div>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/platform.js"></script>
  <script>
  (() => {
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
    }
    function medal(rank) {
      if (rank === 1) return '🥇';
      if (rank === 2) return '🥈';
      if (rank === 3) return '🥉';
      return '#' + rank;
    }
    async function load() {
      const podium = document.getElementById('podium');
      const body = document.getElementById('lbBody');
      try {
        const res = await fetch('/api/leaderboard?limit=100');
        const data = await res.json();
        if (data.public === false) {
          podium.innerHTML = '';
          body.innerHTML = '<div class="lb-empty">' + esc(data.message || 'Рейтинг баста аст') + '</div>';
          return;
        }
        const entries = data.entries || [];
        document.getElementById('lbSub').textContent =
          (data.total || entries.length) + ' иштирокчӣ';
        const top = entries.slice(0, 3);
        let pods = '';
        [2, 1, 3].forEach((place) => {
          const e = top.find(x => x.rank === place) || top[place - 1];
          if (!e) {
            pods += '<div class="pod p' + place + '"><div class="place">' + place + '</div><div class="medal">' + medal(place) + '</div><div class="name">—</div><div class="meta">—</div><div class="score">—</div></div>';
            return;
          }
          const meta = [e.school, e.className].filter(Boolean).join(' · ') || '—';
          pods += '<div class="pod p' + place + '"><div class="place">' + place + '</div><div class="medal">' + medal(place) + '</div><div class="name">' + esc(e.name) + '</div><div class="meta">' + esc(meta) + '</div><div class="score">' + esc(e.rating) + '</div></div>';
        });
        podium.innerHTML = pods;
        if (!entries.length) {
          body.innerHTML = '<div class="lb-empty">Натиҷаҳо ҳоло нест</div>';
          return;
        }
        let rows = entries.map(e => {
          const meta = [e.school, e.className].filter(Boolean).join(' · ');
          return '<tr><td class="lb-rank">' + (e.rank <= 3 ? medal(e.rank) : '#' + e.rank) + '</td><td><strong>' + esc(e.name) + '</strong>' +
            (meta ? '<div style="color:var(--pf-muted);font-size:.82rem;margin-top:.15rem">' + esc(meta) + '</div>' : '') +
            '</td><td style="font-weight:700">' + esc(e.rating) + '</td><td>' + esc(e.solved || 0) + '</td><td>' + esc(e.contests || 0) + '</td></tr>';
        }).join('');
        body.innerHTML = '<table class="lb-table"><thead><tr><th>#</th><th>Ном</th><th>Рейтинг</th><th>Ҳал</th><th>Олимпиада</th></tr></thead><tbody>' + rows + '</tbody></table>';
      } catch (e) {
        body.innerHTML = '<div class="lb-empty">Хато: ' + esc(e.message) + '</div>';
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load);
    else load();
  })();
  </script>

  <!-- Mobile bottom navigation — professional SVG icons -->
  <nav class="pf-bottom-nav" aria-label="Асосӣ">
    <div class="pf-bottom-nav-inner">
      <a href="/" data-nav="home">
        <span class="bn-ico" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1v-9"/></svg>
        </span>
        <span>Асосӣ</span>
      </a>
      <a href="/student" data-nav="oly">
        <span class="bn-ico" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10l-1 7H8L7 4z"/><path d="M5 4h14"/><circle cx="12" cy="9" r="1.5" fill="currentColor" stroke="none"/></svg>
        </span>
        <span>Олимпиадаҳо</span>
      </a>
      <a href="/leaderboard" class="active" data-nav="lb">
        <span class="bn-ico" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4v6a5 5 0 0 0 10 0V4"/><path d="M5 4h14"/><path d="M7 4H4a2 2 0 0 0 2 5"/><path d="M17 4h3a2 2 0 0 1-2 5"/></svg>
        </span>
        <span>Рейтинг</span>
      </a>
      <a href="/courses" data-nav="news">
        <span class="bn-ico" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6z"/></svg>
        </span>
        <span>Хабарҳо</span>
      </a>
    </div>
  </nav>

</body>
</html>
