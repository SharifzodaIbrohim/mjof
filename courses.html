<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хабарҳо — M.J.O.F</title>
  <link rel="stylesheet" href="/css/platform.css" />
  <link rel="stylesheet" href="/css/news.css" />
</head>
<body class="pf-page-news">
  <header class="pf-topbar">
    <a class="pf-brand" href="/">
      <span class="pf-brand-mark">МФ</span>
      <span class="pf-brand-text"><strong>M.J.O.F</strong><span>Маҷмӯаи Олимпиадаҳои Фаннӣ</span></span>
    </a>
    <nav class="pf-nav">
      <a href="/">Хона</a>
      <a href="/student">Олимпиадаҳо</a>
      <a href="/leaderboard">Рейтинг</a>
      <a href="/courses" class="active">Хабарҳо</a>
    </nav>
    <div class="pf-actions">
      <select id="pfLang" class="pf-lang" title="Забон" aria-label="Language">
        <option value="tg">TJ</option>
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button type="button" class="pf-icon-btn" id="pfTheme" title="Тема">🌙</button>
    </div>
  </header>

  <section class="nw-hero">
    <div class="nw-hero-bg" aria-hidden="true"></div>
    <div class="nw-hero-inner">
      <p class="nw-kicker">M.J.O.F · Хабарҳо</p>
      <h1>Хабарҳо, мақолаҳо ва эълонҳо</h1>
      <p class="nw-lead">Навгониҳо, мақолаҳои фаннӣ ва эълонҳои расмии Маҷмӯаи Олимпиадаҳои Фаннӣ.</p>
      <div class="nw-filters" id="nwFilters">
        <button type="button" class="nw-chip active" data-type="">Ҳама</button>
        <button type="button" class="nw-chip" data-type="news">Хабар</button>
        <button type="button" class="nw-chip" data-type="article">Мақола</button>
        <button type="button" class="nw-chip" data-type="magazine">Маҷалла</button>
        <button type="button" class="nw-chip" data-type="announcement">Эълон</button>
      </div>
    </div>
  </section>

  <main class="nw-main">
    <div id="nwFeatured" class="nw-featured hidden"></div>
    <div id="nwGrid" class="nw-grid"></div>
    <p id="nwEmpty" class="nw-empty hidden">Ҳоло хабар нест. Ба зудӣ навгониҳо нашр мешаванд.</p>
  </main>

  <div id="nwModal" class="nw-modal hidden" role="dialog" aria-modal="true" aria-labelledby="nwModalTitle">
    <div class="nw-modal-backdrop" data-close></div>
    <article class="nw-modal-card">
      <button type="button" class="nw-modal-close" data-close aria-label="Пӯшидан">×</button>
      <div id="nwModalCover" class="nw-modal-cover hidden"></div>
      <div class="nw-modal-body">
        <span id="nwModalKind" class="nw-badge"></span>
        <h2 id="nwModalTitle"></h2>
        <p id="nwModalMeta" class="nw-meta"></p>
        <div id="nwModalText" class="nw-article-text"></div>
        <p id="nwModalLink" class="nw-modal-link hidden"></p>
      </div>
    </article>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/platform.js"></script>
  <script src="/js/news.js"></script>

  <!-- Mobile bottom navigation -->
  <nav class="pf-bottom-nav" aria-label="Асосӣ">
    <div class="pf-bottom-nav-inner">
      <a href="/" class="" data-nav="home"><span class="bn-ico" aria-hidden="true">🏠</span><span>Хона</span></a>
      <a href="/student" class="" data-nav="oly"><span class="bn-ico" aria-hidden="true">🏆</span><span>Олимпиадаҳо</span></a>
      <a href="/leaderboard" class="" data-nav="lb"><span class="bn-ico" aria-hidden="true">⭐</span><span>Рейтинг</span></a>
      <a href="/courses" class="active" data-nav="news"><span class="bn-ico" aria-hidden="true">📰</span><span>Хабарҳо</span></a>
    </div>
  </nav>

</body>
</html>
