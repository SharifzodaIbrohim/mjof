<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хабарҳо — M.J.O.F</title>
  <link rel="stylesheet" href="/css/platform.css" />
  <link rel="stylesheet" href="/css/news.css" />
</head>
<body class="pf-page-news">
  <header class="pf-topbar">
    <a class="pf-brand" href="/">
      <span class="pf-brand-mark">МФ</span>
      <span class="pf-brand-text"><strong>M.J.O.F</strong><span>Маҷмӯаи Олимпиадаҳои Фаннӣ</span></span>
    </a>
    <nav class="pf-nav">
      <a href="/">Асосӣ</a>
      <a href="/student">Олимпиадаҳо</a>
      <a href="/leaderboard">Рейтинг</a>
      <a href="/courses" class="active">Хабарҳо</a>
    </nav>
    <div class="pf-actions">
      <select id="pfLang" class="pf-lang" title="Забон" aria-label="Language">
        <option value="tg">TJ</option>
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button type="button" class="pf-icon-btn" id="pfTheme" title="Тема">🌙</button>
    </div>
  </header>

  <section class="nw-hero">
    <div class="nw-hero-bg" aria-hidden="true"></div>
    <div class="nw-hero-inner">
      <p class="nw-kicker">M.J.O.F · Хабарҳо</p>
      <h1>Хабарҳо, мақолаҳо ва эълонҳо</h1>
      <p class="nw-lead">Навгониҳо, мақолаҳои фаннӣ ва эълонҳои расмии Маҷмӯаи Олимпиадаҳои Фаннӣ.</p>
      <div class="nw-filters" id="nwFilters">
        <button type="button" class="nw-chip active" data-type="">Ҳама</button>
        <button type="button" class="nw-chip" data-type="news">Хабар</button>
        <button type="button" class="nw-chip" data-type="article">Мақола</button>
        <button type="button" class="nw-chip" data-type="magazine">Маҷалла</button>
        <button type="button" class="nw-chip" data-type="announcement">Эълон</button>
      </div>
    </div>
  </section>

  <main class="nw-main">
    <div id="nwFeatured" class="nw-featured hidden"></div>
    <div id="nwGrid" class="nw-grid"></div>
    <p id="nwEmpty" class="nw-empty hidden">Ҳоло хабар нест. Ба зудӣ навгониҳо нашр мешаванд.</p>
  </main>

  <div id="nwModal" class="nw-modal hidden" role="dialog" aria-modal="true" aria-labelledby="nwModalTitle">
    <div class="nw-modal-backdrop" data-close></div>
    <article class="nw-modal-card">
      <button type="button" class="nw-modal-close" data-close aria-label="Пӯшидан">×</button>
      <div id="nwModalCover" class="nw-modal-cover hidden"></div>
      <div class="nw-modal-body">
        <span id="nwModalKind" class="nw-badge"></span>
        <h2 id="nwModalTitle"></h2>
        <p id="nwModalMeta" class="nw-meta"></p>
        <div id="nwModalText" class="nw-article-text"></div>
        <p id="nwModalLink" class="nw-modal-link hidden"></p>
      </div>
    </article>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/platform.js"></script>
  <script src="/js/news.js"></script>

  <!-- Mobile bottom navigation — professional SVG icons -->
  <nav class="pf-bottom-nav" aria-label="Асосӣ">
    <div class="pf-bottom-nav-inner">
      <a href="/" data-nav="home">
        <span class="bn-ico" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1v-9"/></svg>
        </span>
        <span>Асосӣ</span>

      <a href="/student" data-nav="oly">
        <span class="bn-ico" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10l-1 7H8L7 4z"/><path d="M5 4h14"/><circle cx="12" cy="9" r="1.5" fill="currentColor" stroke="none"/></svg>
        </span>
        <span>Олимпиадаҳо</span>
      </a>
      <a href="/leaderboard" data-nav="lb">
        <span class="bn-ico" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4v6a5 5 0 0 0 10 0V4"/><path d="M5 4h14"/><path d="M7 4H4a2 2 0 0 0 2 5"/><path d="M17 4h3a2 2 0 0 1-2 5"/></svg>
        </span>
        <span>Рейтинг</span>
      </a>
      <a href="/courses" class="active" data-nav="news">
        <span class="bn-ico" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6z"/></svg>
        </span>
        <span>Хабарҳо</span>
      </a>
    </div>
  </nav>

</body>
</html>
