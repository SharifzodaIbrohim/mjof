<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хабарҳо — Маҷмӯаи Олимпиадаҳои Фаннӣ</title>
  <link rel="stylesheet" href="css/platform.css" />
  <style>
    .cs-wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .cs-hero h1 { margin: 0 0 0.35rem; font-size: 1.55rem; }
    .cs-hero p { color: var(--pf-muted); margin: 0 0 1.5rem; }
    .cs-grid { display: grid; gap: 0.9rem; }
    .cs-card {
      background: var(--pf-panel); border: 1px solid var(--pf-line); border-radius: 12px;
      padding: 1.15rem 1.25rem; box-shadow: var(--pf-shadow);
    }
    .cs-card .kind {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--pf-accent); font-weight: 700;
    }
    .cs-card h3 { margin: 0.35rem 0; font-size: 1.05rem; }
    .cs-card p { margin: 0; color: var(--pf-muted); font-size: 0.9rem; line-height: 1.5; }
    .cs-card a {
      display: inline-block; margin-top: 0.65rem; color: #fff; background: var(--pf-accent);
      text-decoration: none; font-weight: 600; font-size: 0.85rem;
      padding: 0.45rem 0.85rem; border-radius: 8px;
    }
    .cs-empty { color: var(--pf-muted); padding: 2.5rem 1rem; text-align: center;
      background: var(--pf-panel); border: 1px dashed var(--pf-line); border-radius: 12px; }
  </style>
</head>
<body class="pf-page-courses">
  <header class="pf-topbar">
    <a class="pf-brand" href="/">
      <span class="pf-brand-mark">МФ</span>
      <span class="pf-brand-text"><strong>M.J.O.F</strong><span>Маҷмӯаи Олимпиадаҳои Фаннӣ</span></span>
    </a>
    <nav class="pf-nav">
      <a href="/">Хона</a>
      <a href="/student">Олимпиадаҳо</a>
      <a href="/leaderboard">Рейтинг</a>
      <a href="/courses" class="active">Хабарҳо</a>
    </nav>
    <div class="pf-actions">
      <select id="pfLang" class="pf-lang" title="Забон" aria-label="Language">
        <option value="tg">TJ</option>
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button type="button" class="pf-icon-btn" id="pfTheme" title="Тема">🌙</button>
    </div>
  </header>

  <main class="cs-wrap">
    <div class="cs-hero">
      <h1>Хабарҳо ва эълонҳо</h1>
      <p>Хабарҳо, эълонҳо ва маълумотҳои Маҷмӯаи Олимпиадаҳои Фаннӣ.</p>
    </div>
    <div id="csGrid" class="cs-grid"></div>
    <p id="csEmpty" class="cs-empty hidden">Ҳоло хабар нест.</p>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/platform.js"></script>
  <script>
  (() => {
    const grid = document.getElementById('csGrid');
    const empty = document.getElementById('csEmpty');
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
    }
    fetch('/api/content').then(r => r.json()).then(d => {
      const items = d.items || [];
      if (!items.length) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      grid.innerHTML = items.map(i => {
        const url = i.url || '#';
        const open = url && url !== '#' ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">Муфассал →</a>' : '';
        return '<article class="cs-card"><span class="kind">Хабар</span><h3>' + esc(i.title) + '</h3><p>' + esc(i.description || '') + '</p>' + open + '</article>';
      }).join('');
    }).catch(() => { empty.classList.remove('hidden'); });
  })();
  </script>
</body>
</html>
